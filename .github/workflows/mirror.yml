# Build Tuwunel from the commit pinned in mirror.toml, mirror its source, sign everything with the FreeSynergy release key
# (existing secrets GPG_PRIVATE_KEY / GPG_PASSPHRASE, used only by fs-release's sign-files action) and create a DRAFT release.
# Never publishes. Runs only by hand (workflow_dispatch).
# Two jobs: `build` runs foreign build code WITHOUT secrets and with read-only rights; `sign` has the secrets and the write rights but runs
# no foreign code, only fs-release actions pinned by commit SHA and the checked-in verify script.
name: mirror
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also create the DRAFT GitHub release (never public; a person publishes it)"
        type: boolean
        default: false
      build_only:
        description: "Test build: no signing, no release, artifact upload only (for CI checks before the signing secrets are set)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pin from mirror.toml
        id: pin
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          m = tomllib.load(open("mirror.toml", "rb"))
          print("repository=" + m["source"]["repository"]); print("tag=" + m["source"]["tag"])
          print("commit=" + m["source"]["commit"]); print("version=" + m["upstream"]["version"])
          PY
      - name: Upstream tag must still resolve to the pinned commit
        env:
          REPO: ${{ steps.pin.outputs.repository }}
          TAG: ${{ steps.pin.outputs.tag }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          got=$(git ls-remote "$REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'END{print $1}')
          echo "upstream $TAG -> $got (pinned $COMMIT)"
          test "$got" = "$COMMIT"
      - name: Fetch exactly the pinned commit
        env:
          REPO: ${{ steps.pin.outputs.repository }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          git init -q src && cd src
          git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: "Source tarball and licence (Apache-2.0, the source travels with the binary)"
        env:
          V: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git -C src archive --format=tar --prefix="tuwunel-$V/" HEAD | gzip -n > "dist/tuwunel-$V-source.tar.gz"
          cp src/LICENSE dist/LICENSE-Apache-2.0
      - name: Build dependencies (liburing, LLVM and libclang for RocksDB)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends liburing-dev clang libclang-dev llvm pkg-config cmake
      - name: Rust toolchain (as pinned by upstream rust-toolchain.toml)
        working-directory: src
        run: rustup toolchain install --profile minimal && cargo --version
      - name: Build (cargo build --release, default features)
        working-directory: src
        run: |
          set -euo pipefail
          cargo build --release -p tuwunel
          git diff --stat -- Cargo.lock
      - name: Stage and pack (reproducible tar)
        env:
          V: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          s=stage
          install -d "$s/usr/bin" "$s/usr/share/doc/tuwunel"
          install -m755 src/target/release/tuwunel "$s/usr/bin/tuwunel"
          install -m644 src/tuwunel-example.toml src/LICENSE "$s/usr/share/doc/tuwunel/"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@"$(git -C src log -1 --format=%ct)" -C "$s" -czf "dist/tuwunel-$V-linux-x86_64.tar.gz" .
      - uses: FreeSynergy/fs-release/actions/sbom@fbac18832673936a6586989874db388270371195 # fs-release main on 2026-11-11 (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          name: tuwunel
          version: ${{ steps.pin.outputs.version }}
          working-directory: src
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuwunel-unsigned
          path: dist
          retention-days: 3
  sign:
    needs: build
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key must be present (a mirror is never published unsigned)
        env:
          K: ${{ secrets.GPG_PRIVATE_KEY }}
        run: test -n "$K" || { echo "::error::GPG_PRIVATE_KEY is not set in this repository"; exit 1; }
      - name: Read the pin from mirror.toml
        id: pin
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          m = tomllib.load(open("mirror.toml", "rb"))
          print("repository=" + m["source"]["repository"]); print("tag=" + m["source"]["tag"])
          print("commit=" + m["source"]["commit"]); print("version=" + m["upstream"]["version"])
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tuwunel-unsigned
          path: dist
      - uses: FreeSynergy/fs-release/actions/sign-files@fbac18832673936a6586989874db388270371195 # fs-release main on 2026-11-11 (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          mode: packages
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: FreeSynergy/fs-release/actions/checksums@fbac18832673936a6586989874db388270371195 # fs-release main on 2026-11-11 (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
      - uses: FreeSynergy/fs-release/actions/sign-files@fbac18832673936a6586989874db388270371195 # fs-release main on 2026-11-11 (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          mode: detached
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Verify our signatures against the project's public key (fingerprint from mirror.toml; nothing secret is printed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/FreeSynergy/fs-release/contents/release-signing-key.asc --jq .content | base64 -d > "$RUNNER_TEMP/release-signing-key.asc"
          scripts/verify-mirror.sh dist "$RUNNER_TEMP/release-signing-key.asc"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuwunel-mirror-signed
          path: dist
      - if: ${{ inputs.draft_release }}
        uses: FreeSynergy/fs-release/actions/draft-release@fbac18832673936a6586989874db388270371195 # fs-release main on 2026-11-11 (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          tag: v${{ steps.pin.outputs.version }}
          name: Tuwunel
          token: ${{ github.token }}
